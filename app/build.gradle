plugins {
    id 'com.android.application'
}

android {
    namespace 'com.castapp.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.castapp.tv'
        // Capturing other apps' audio (AudioPlaybackCapture) needs Android 10+
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the CI-built APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
